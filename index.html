<head>

<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a:focus-visible { outline: 2px solid #000; outline-offset: 4px; }

  /* Hero: logo sits over the cover image, as on the Wix original */
  .hero {
    position: relative;
    display: flex;
    align-items: center;
    height: clamp(26rem, 44vw, 52rem);
    padding: 7.5rem 13.3vw 2rem;
    background-color: #b9efe8;
    background-image: url("cover.jpg"), linear-gradient(120deg, #93ede3, #e6f8f6);
    background-size: cover;
    background-position: center;
  }
  .brand {
    position: absolute;
    top: 29px;
    left: 13.2vw;
    font-weight: 700;
    font-size: 2rem;
    color: #000;
    text-decoration: none;
  }
  .brand img { display: block; width: 97px; height: auto; }

  .hero h1 {
    margin: 0;
    font-size: clamp(2.25rem, 3.4vw, 4rem);
    font-weight: 300;
    line-height: 1.2;
    letter-spacing: 0;
  }
  .hero .years {
    display: block;
    margin-top: 1.1em;
    font-size: 0.5em;
    line-height: 1.2;
  }

  /* Footer */
  .rule {
    height: 1px;
    margin: 39px 11vw 0;
    border: 0;
    background: #000;
  }
  .site-footer {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 56px 8.5vw 180px 7.9vw;
    font-size: 14px;
    line-height: 1.35;
    color: #444;
  }
  .site-footer img { display: block; width: 71px; height: auto; margin-bottom: 33px; }
  .site-footer p { margin: 0; }
  .site-footer .company { font-weight: 500; color: #333; }
  .site-footer .copyright { margin-top: 1.35em; }

  .social { display: block; margin-bottom: 8px; color: #000; line-height: 0; }
  .social:hover { opacity: 0.6; }
  .social svg { width: 28px; height: 28px; fill: currentColor; }

  @media (max-width: 600px) {
    .site-footer { padding-bottom: 64px; }
  }
</style>

<body>

<main class="hero">
  <a class="brand" href="/" aria-label="TJC home">
    <img src="logo.png" alt="TJC" onerror="this.replaceWith(document.createTextNode('TJC'))">
  </a>
  <h1>Mission-driven<br>problem solvers <span class="years">2009 - 2025</span></h1>
</main>

<hr class="rule">

<footer class="site-footer">
  <div>
    <img src="logo-small.png" alt="" onerror="this.remove()">
    <p class="company">Tobias Jones Consulting Limited in</p>
    <p class="company">Members' Voluntary Liquidation</p>
    <p>Registered in England and Wales</p>
    <p>Company No 7101851</p>
    <p class="copyright">© TJC 2025</p>
  </div>
</footer>
